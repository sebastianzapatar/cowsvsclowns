plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// Cobertura de código: instrumenta las clases durante los tests y genera el
	// reporte HTML en build/reports/jacoco/test/html/index.html
	id 'jacoco'
}

group = 'com.sebasmalparqueado'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Expone /actuator/health, que es lo que usa el healthcheck del compose para
	// saber si la app ya terminó de arrancar (y no solo si el proceso existe).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Swagger / OpenAPI. La línea 3.x es la compatible con Spring Boot 4;
	// la 2.x solo funciona con Spring Boot 3.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// ============================ Seguridad ==============================
	// spring-boot-starter-security  -> la cadena de filtros de Spring Security.
	//   Solo con tenerlo en el classpath, TODA la app queda cerrada por defecto
	//   (401 en cualquier ruta). Quién puede entrar a qué se decide en
	//   common/config/SecurityConfig.java.
	//
	// ...-security-oauth2-resource-server -> el trozo que entiende JWT.
	//   Convierte a la app en un "resource server": no tiene login propio ni
	//   guarda contraseñas; solo recibe un token que emitió Keycloak, verifica
	//   la firma contra las llaves públicas del realm y saca de ahí el usuario
	//   y sus roles.
	//
	// OJO con los nombres: en Spring Boot 4 los starters se reorganizaron y
	// este pasó a llamarse "spring-boot-starter-security-oauth2-resource-server".
	// En Boot 3 era "spring-boot-starter-oauth2-resource-server" (sin
	// "security-"); si copiás un tutorial viejo, Gradle no lo resuelve.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Utilidades para probar seguridad sin Keycloak levantado: aporta los
	// post-processors jwt(...) de MockMvc, que inyectan un token ya "validado"
	// con los roles que uno elija. Ver SecurityConfigIntegrationTest.
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Al terminar los tests genera el reporte de cobertura automáticamente, así
	// con un solo "./gradlew test" ya quedan las dos páginas HTML listas.
	finalizedBy tasks.named('jacocoTestReport')
}

// ======================= Correr las pruebas por tipo =========================
// La tarea "test" las corre todas juntas. Estas tres permiten correr solo una
// familia, que es lo útil mientras se trabaja: las unitarias tardan menos de un
// segundo, mientras que las e2e levantan la aplicación entera y son las lentas.
//
// La clasificación se hace por el nombre de la clase, que es la convención que
// ya seguía el proyecto:
//
//   *E2ETest          -> levantan la app completa y pegan por HTTP
//   *IntegrationTest  -> levantan una porción de Spring (@WebMvcTest, @DataJpaTest)
//   el resto          -> unitarias puras, sin contexto de Spring
//
// Ninguna de las tres genera reporte de cobertura: el porcentaje solo tiene
// sentido con la suite completa, porque una clase cubierta por las e2e
// aparecería como no cubierta al correr solo las unitarias. Para cobertura va
// "./gradlew test".
def registrarSuite = { String nombre, String descripcion, Closure filtro ->
	tasks.register(nombre, Test) {
		group = 'verification'
		it.description = descripcion
		useJUnitPlatform()
		// Sin estas dos líneas la tarea no sabe qué compilar ni con qué
		// classpath: hereda de "test" solo la configuración, no las entradas.
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		filter(filtro)
	}
}

registrarSuite('pruebasUnitarias',
		'Solo las pruebas unitarias (servicios, mappers y excepciones).') {
	// Se define por descarte: todo lo que no sea integración, e2e ni el smoke
	// del contexto. Así una clase unitaria nueva entra sola, sin tocar nada.
	excludeTestsMatching '*IntegrationTest'
	excludeTestsMatching '*E2ETest'
	excludeTestsMatching 'CowsvsclownApplicationTests'
}

registrarSuite('pruebasIntegracion',
		'Solo las pruebas de integración (controllers con MockMvc y repositorios con H2).') {
	includeTestsMatching '*IntegrationTest'
}

registrarSuite('pruebasE2E',
		'Solo las pruebas end to end (la app completa por HTTP real).') {
	includeTestsMatching '*E2ETest'
}

jacoco {
	toolVersion = '0.8.14'
}

// Clases que no aportan nada al medir cobertura: son datos o arranque, no lógica.
// Si las dejamos dentro, el porcentaje baja sin que haya nada real que testear.
def coberturaExcluida = [
		'**/CowsvsclownApplication.class',
		'**/config/**',
		'**/dto/**',
		'**/entity/**'
]

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		html.required = true   // la página que se abre en el navegador
		xml.required = true    // formato que leen SonarQube / CI
		csv.required = false
	}

	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: coberturaExcluida)
			})
	)
}

// Falla el build si la cobertura baja del mínimo. Útil para que un cambio no
// meta lógica nueva sin tests sin que nadie se dé cuenta.
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')

	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
		rule {
			element = 'CLASS'
			// Los mappers/servicios sí deben tener sus ramas cubiertas.
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.50
			}
			excludes = ['com.sebasmalparqueado.cowsvsclown.CowsvsclownApplication']
		}
	}

	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: coberturaExcluida)
			})
	)
}

// Engancha la verificación a "check" (y por tanto a "build"): si alguien mete
// lógica nueva sin tests, el build falla en vez de pasar en silencio.
tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Tarea de conveniencia: corre los tests, arma los reportes y te dice dónde
// quedaron. "./gradlew cobertura"
tasks.register('cobertura') {
	group = 'verification'
	description = 'Corre los tests y genera los reportes HTML de tests y cobertura.'
	dependsOn tasks.named('jacocoTestReport')

	def reporteTests = layout.buildDirectory.file('reports/tests/test/index.html')
	def reporteCobertura = layout.buildDirectory.file('reports/jacoco/test/html/index.html')

	doLast {
		println ''
		println 'Reportes generados:'
		println "  Tests     -> ${reporteTests.get().asFile.toURI()}"
		println "  Cobertura -> ${reporteCobertura.get().asFile.toURI()}"
		println ''
	}
}

// ===================== Publicar los reportes al repositorio ==================
// Los HTML que genera Gradle viven en build/, que está en .gitignore porque es
// contenido generado. Esta tarea los copia a docs/reportes/, que sí se versiona,
// para poder abrirlos desde GitHub sin tener que clonar y correr las pruebas.
//
// Es una FOTO del momento en que se corrió: no se actualiza sola. Después de
// tocar código hay que volver a ejecutar "./gradlew publicarReportes" o lo que
// está publicado deja de reflejar la realidad. Si eso molesta, la alternativa
// es no versionarlos y bajarlos del workflow "reportes.yml", que los sube como
// artifact en cada ejecución manual.
tasks.register('publicarReportes', Copy) {
	group = 'verification'
	description = 'Copia los reportes de pruebas y cobertura a docs/reportes/ (versionado).'
	dependsOn tasks.named('jacocoTestReport')

	// Se borra primero para que no queden archivos de una corrida anterior:
	// los nombres de las páginas de JaCoCo dependen de las clases, así que al
	// renombrar o borrar una clase quedarían huérfanos y confundirían.
	doFirst {
		delete layout.projectDirectory.dir('docs/reportes')
	}

	into layout.projectDirectory.dir('docs/reportes')

	into('pruebas') {
		from layout.buildDirectory.dir('reports/tests/test')
	}
	into('cobertura') {
		from layout.buildDirectory.dir('reports/jacoco/test/html')
	}

	doLast {
		println ''
		println 'Reportes publicados en docs/reportes/'
		println '  Pruebas   -> docs/reportes/pruebas/index.html'
		println '  Cobertura -> docs/reportes/cobertura/index.html'
		println ''
	}
}

// Igual que "cobertura", pero además abre las dos páginas en el navegador.
// "./gradlew coberturaAbrir"
tasks.register('coberturaAbrir') {
	group = 'verification'
	description = 'Corre los tests, genera los reportes y los abre en el navegador.'
	dependsOn tasks.named('cobertura')

	def reportes = [
			layout.buildDirectory.file('reports/tests/test/index.html'),
			layout.buildDirectory.file('reports/jacoco/test/html/index.html')
	]
	def so = System.getProperty('os.name').toLowerCase()

	doLast {
		def comando = so.contains('mac') ? 'open' : so.contains('win') ? 'explorer' : 'xdg-open'
		reportes.each { reporte ->
			// ProcessBuilder en vez de exec {}: Gradle 9 eliminó Project.exec().
			new ProcessBuilder(comando, reporte.get().asFile.absolutePath).start().waitFor()
		}
	}
}

// El plugin de Spring Boot genera DOS jars: el ejecutable y uno "-plain" con
// solo las clases. Eso rompía el Dockerfile, porque "COPY build/libs/*.jar
// app.jar" encontraba dos archivos y Docker falla cuando el origen es múltiple
// y el destino es un solo archivo.
tasks.named('jar') {
	enabled = false
}

// Nombre fijo del jar ejecutable: así el Dockerfile lo copia por nombre exacto
// y no depende de la versión del proyecto.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
