# =============================================================================
# "test" PROFILE  ->  activated with @ActiveProfiles("test")
# =============================================================================
# Uses in-memory H2: each test starts with clean tables and doesn't depend on
# an external Postgres. create-drop creates the tables on startup and drops
# them when the session closes.
#
# The url below is only used by CowsvsclownApplicationTests. Every other family
# overrides it with a @TestPropertySource pointing at a database of its own
# (integrationdb, repositorydb, e2edb), because H2 identifies an in-memory
# database by its URL and the e2e tests drop the schema when their context is
# discarded. See "Cada familia tiene su propia base H2" in the README.
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: warn
    com.sebasmalparqueado.cowsvsclown: info
