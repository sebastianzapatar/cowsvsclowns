# =============================================================================
# "dev" PROFILE  ->  activated with: spring.profiles.active=dev
# =============================================================================
# For working on your local machine, with a local Postgres (no Docker).
# This is the default profile: if you don't specify anything, this one is used.
#
# If you prefer to start only the database with Docker and run the app from the IDE:
#     docker compose up -d db
# and leave this profile pointing to localhost with the port from your .env.
# =============================================================================

spring:
  datasource:
    # Default values (after the ":") match .env.template,
    # so this starts without configuring anything if you followed that template.
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:cowsvsclown_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "update" adjusts the tables on startup: convenient during development.
      # Never use in production, use migrations there (Flyway or Liquibase).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    # Shows the values that go into the "?" in the queries.
    # Only in dev: prints real data in the logs.
    org.hibernate.orm.jdbc.bind: trace
    # The application's own logs (e.g. log.info from services).
    com.sebasmalparqueado.cowsvsclown: debug
