# =============================================================================
# "docker" PROFILE  ->  activated with: SPRING_PROFILES_ACTIVE=docker
# =============================================================================
# To run with "docker compose up". Values arrive as environment variables
# from compose.yml (which in turn reads them from .env).
# The database host is NOT localhost: it's "db", the service name on the Docker network.
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # The app might start slightly before Postgres accepts connections.
      # This allows it to retry for 30 seconds instead of crashing
      # on the first failed attempt.
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      # Provided by compose.yml. "update" makes tables self-adjust
      # when running down and up again, without deleting data.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    com.sebasmalparqueado.cowsvsclown: info
