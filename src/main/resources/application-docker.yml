# =============================================================================
# PERFIL "docker"  ->  se activa con: SPRING_PROFILES_ACTIVE=docker
# =============================================================================
# Para correr con "docker compose up". Los valores llegan como variables de
# entorno desde compose.yml (que a su vez las lee del .env).
# El host de la base NO es localhost: es "db", el nombre del servicio en la red
# de Docker.
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # La app puede arrancar un instante antes de que Postgres acepte
      # conexiones. Con esto reintenta durante 30 segundos en vez de morirse
      # en el primer intento fallido.
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      # Llega desde compose.yml. "update" hace que al hacer down y up de nuevo
      # las tablas se ajusten solas a las entidades, sin borrar los datos.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    com.sebasmalparqueado.cowsvsclown: info
